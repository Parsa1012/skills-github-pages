name: Build and test Twin Balls
on:
  workflow_dispatch:
  push:
    paths:
      - 'mirror/**'
      - 'tools/**'
      - 'app/**'
      - 'build.gradle'
      - 'settings.gradle'
      - '.github/workflows/mirror-build.yml'
  pull_request:
    paths:
      - 'mirror/**'
      - 'tools/**'
      - 'app/**'
      - 'build.gradle'
      - 'settings.gradle'
      - '.github/workflows/mirror-build.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          gradle-version: '8.14.6'
      - name: Report runtime dependencies
        run: gradle :mirror:dependencies --configuration releaseRuntimeClasspath
      - run: sh tools/test_engine.sh
      - run: python3 tools/test_ui_contracts.py
      - run: python3 tools/test_security.py
      - name: Fail closed without signing configuration
        shell: bash
        run: |
          if gradle :mirror:validateReleaseSigning; then
            echo 'Unexpectedly accepted an unconfigured release' >&2
            exit 1
          fi
      - name: Reject a copy of the exposed test key as production
        shell: bash
        run: |
          cp mirror/signing/mirror-dev.p12 /tmp/mirror-public-copy.p12
          export MIRROR_KEYSTORE_PATH=/tmp/mirror-public-copy.p12 MIRROR_KEYSTORE_PASSWORD=mirror-dash-dev MIRROR_KEY_ALIAS=mirror MIRROR_KEY_PASSWORD=mirror-dash-dev
          if gradle :mirror:validateReleaseSigning; then
            echo 'Unexpectedly accepted the exposed test key as production' >&2
            exit 1
          fi
      - name: Exercise private-keystore release signing with a disposable CI key
        shell: bash
        run: |
          set -euo pipefail
          keytool -genkeypair -keystore /tmp/ci-disposable.p12 -storetype PKCS12 -storepass temporary-ci-only -keypass temporary-ci-only -alias ci-only -dname 'CN=Disposable CI Test' -keyalg RSA -keysize 2048 -validity 2 -noprompt
          export MIRROR_KEYSTORE_PATH=/tmp/ci-disposable.p12 MIRROR_KEYSTORE_PASSWORD=temporary-ci-only MIRROR_KEY_ALIAS=ci-only MIRROR_KEY_PASSWORD=temporary-ci-only
          gradle :mirror:assembleRelease
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose --print-certs mirror/build/outputs/apk/release/mirror-release.apk
          rm /tmp/ci-disposable.p12
      - run: gradle :mirror:clean :mirror:assembleDebug :mirror:assembleRelease -PallowInsecureDevSigning=true
      - name: Verify release identity and signature
        shell: bash
        run: |
          set -euo pipefail
          tools="$ANDROID_HOME/build-tools/34.0.0"
          apk=mirror/build/outputs/apk/release/mirror-release.apk
          "$tools/apksigner" verify --verbose --print-certs "$apk" | tee /tmp/signature.txt
          grep -qi '09228d155ddceb4fbe9897406cf4576db9dfe0a449f4ef391c1aeaaf1227664c' /tmp/signature.txt
          "$tools/aapt" dump badging "$apk" | tee /tmp/badging.txt
          grep -q "package: name='io.github.parsa1012.mirrordash' versionCode='19' versionName='1.9.9'" /tmp/badging.txt
          grep -q "sdkVersion:'21'" /tmp/badging.txt
          "$tools/aapt" dump permissions "$apk" > /tmp/permissions.txt
          if grep -q 'uses-permission' /tmp/permissions.txt; then cat /tmp/permissions.txt; exit 1; fi
          "$tools/aapt" dump xmltree "$apk" AndroidManifest.xml > /tmp/manifest.txt
          grep 'android:allowBackup' /tmp/manifest.txt | grep -q '0x0'
          grep 'android:usesCleartextTraffic' /tmp/manifest.txt | grep -q '0x0'
          grep 'android:fullBackupContent' /tmp/manifest.txt | grep -q '0x0'
          grep -q 'android:dataExtractionRules' /tmp/manifest.txt
          if grep 'android:debuggable' /tmp/manifest.txt | grep -q '0xffffffff'; then exit 1; fi
          sha256sum "$apk"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: twin-balls-apks
          path: |
            mirror/build/outputs/apk/debug/*.apk
            mirror/build/outputs/apk/release/*.apk
  # Publishes only the specifically requested build; ordinary pushes and PRs stay read-only.
  publish:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/arena/323dcaf0-skills-github-pages' && startsWith(github.event.head_commit.message, 'Publish Twin Balls 1.9.9')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: twin-balls-apks
          path: apks
      - name: Publish APK
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          cp apks/release/mirror-release.apk twin-balls-1.9.9-PUBLIC-TEST-KEY.apk
          gh release create v1.9.9 twin-balls-1.9.9-PUBLIC-TEST-KEY.apk \
            --target "$GITHUB_SHA" --title 'توپ‌های همزاد ۱٫۹٫۹' \
            --notes 'TEST ONLY: signed with the publicly known historical key. Not a trusted production release. See mirror/SECURITY_AUDIT_FA.md.'
