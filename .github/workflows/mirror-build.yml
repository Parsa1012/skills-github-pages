name: Build and test Twin Balls
on:
  workflow_dispatch:
  push:
    paths:
      - 'mirror/**'
      - 'tools/**'
      - 'app/**'
      - 'build.gradle'
      - 'settings.gradle'
      - '.github/workflows/mirror-build.yml'
  pull_request:
    paths:
      - 'mirror/**'
      - 'tools/**'
      - 'app/**'
      - 'build.gradle'
      - 'settings.gradle'
      - '.github/workflows/mirror-build.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - run: sh tools/test_engine.sh
      - run: gradle :mirror:assembleDebug :mirror:assembleRelease
      - name: Verify release identity and signature
        shell: bash
        run: |
          set -euo pipefail
          tools="$ANDROID_HOME/build-tools/34.0.0"
          apk=mirror/build/outputs/apk/release/mirror-release.apk
          "$tools/apksigner" verify --verbose --print-certs "$apk" | tee /tmp/signature.txt
          grep -qi '09228d155ddceb4fbe9897406cf4576db9dfe0a449f4ef391c1aeaaf1227664c' /tmp/signature.txt
          "$tools/aapt" dump badging "$apk" | tee /tmp/badging.txt
          grep -q "package: name='io.github.parsa1012.mirrordash' versionCode='14' versionName='1.9.4'" /tmp/badging.txt
      - uses: actions/upload-artifact@v4
        with:
          name: twin-balls-apks
          path: |
            mirror/build/outputs/apk/debug/*.apk
            mirror/build/outputs/apk/release/*.apk
  # Publishes only the specifically requested build; ordinary pushes and PRs stay read-only.
  publish:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/arena/323dcaf0-skills-github-pages' && startsWith(github.event.head_commit.message, 'Publish Twin Balls 1.9.4')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: twin-balls-apks
          path: apks
      - name: Publish APK
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create v1.9.4 'apks/release/mirror-release.apk#mirror-dash-1.9.4.apk' \
            --target "$GITHUB_SHA" --title 'توپ‌های همزاد ۱٫۹٫۴' \
            --notes 'سکه‌های مرحله‌ای، فروشگاه ظاهر و موسیقی جدید منو. نسخهٔ انتشار با امضای قبلی ساخته شده است.'
