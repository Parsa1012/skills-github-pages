name: Build Mirror APK

# Builds the "Mirror" game module and publishes the debug APK back onto the
# branch (artifact + dist/mirror-dash-debug.apk).
on:
  workflow_dispatch:
  push:
    branches:
      - arena/0e2225b6-skills-github-pages
    paths:
      - 'mirror/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - '.github/workflows/build-mirror-apk.yml'

permissions:
  contents: write

jobs:
  build:
    name: Assemble mirror debug APK
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        run: |
          set -eu
          echo "ANDROID_HOME=${ANDROID_HOME:-unset}"
          if [ -z "${ANDROID_HOME:-}" ]; then
            echo "No pre-installed Android SDK found" >&2
            exit 1
          fi
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ] && [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          fi
          if [ -n "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
            "$SDKMANAGER" --install "platforms;android-34" "build-tools;34.0.0" "platform-tools" || true
          else
            echo "sdkmanager not found; relying on Gradle's SDK auto-download"
          fi

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build mirror debug APK
        run: gradle :mirror:assembleDebug --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: mirror-dash-debug-apk
          path: mirror/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Publish APK onto the branch
        run: |
          set -eu
          mkdir -p dist
          cp mirror/build/outputs/apk/debug/*.apk dist/mirror-dash-debug.apk
          ls -l dist/mirror-dash-debug.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f dist/mirror-dash-debug.apk
          if git diff --cached --quiet; then
            echo "APK unchanged, nothing to publish"
          else
            git commit -m "CI: publish mirror-dash-debug.apk [skip ci]"
            git push
          fi
