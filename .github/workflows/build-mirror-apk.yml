name: Build Mirror APK

# Builds the "Mirror" game (debug + signed release) and publishes the APKs back onto the
# branch, together with a small status file that records what happened and how the APKs
# were verified. The release build is allowed to fail without blocking the debug build, so
# a signing problem never leaves the branch without an installable APK.
on:
  workflow_dispatch:
  push:
    branches:
      - arena/0e2225b6-skills-github-pages
    paths:
      - 'mirror/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - '.github/workflows/build-mirror-apk.yml'

permissions:
  contents: write

jobs:
  build:
    name: Assemble mirror APKs
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Test real game generator
        run: |
          tools/test_engine.sh
          python3 tools/simulate_generation.py

      - name: Install Android SDK packages
        run: |
          set -eu
          echo "ANDROID_HOME=${ANDROID_HOME:-unset}"
          if [ -z "${ANDROID_HOME:-}" ]; then
            echo "No pre-installed Android SDK found" >&2
            exit 1
          fi
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ] && [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          fi
          if [ -n "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
            "$SDKMANAGER" --install "platforms;android-34" "build-tools;34.0.0" "platform-tools" || true
          else
            echo "sdkmanager not found; relying on Gradle's SDK auto-download"
          fi

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        run: gradle :mirror:assembleDebug --no-daemon --stacktrace

      - name: Build release APK
        id: release
        continue-on-error: true
        run: |
          set -o pipefail
          gradle :mirror:assembleRelease --no-daemon --console=plain 2>&1 | tee /tmp/release.log

      - name: Collect, verify and publish APKs
        if: always()
        run: |
          set -u
          mkdir -p dist
          STATUS=dist/build-status.txt
          BUILD_TOOLS="$(ls -d "$ANDROID_HOME"/build-tools/* 2>/dev/null | sort -V | tail -1 || true)"
          SIGNER="$BUILD_TOOLS/apksigner"

          {
            echo "run=$GITHUB_RUN_ID"
            echo "commit=$GITHUB_SHA"
            echo "release_step_outcome=${{ steps.release.outcome }}"
            echo "build_tools=$BUILD_TOOLS"
            date -u
          } > "$STATUS"

          if [ -f /tmp/release.log ]; then
            echo "--- release build log (tail) ---" >> "$STATUS"
            tail -n 40 /tmp/release.log >> "$STATUS" || true
          fi

          publish() {
            src="$1"
            name="$2"
            if [ ! -f "$src" ]; then
              echo "missing: $src" >> "$STATUS"
              return 0
            fi
            cp "$src" "dist/$name"
            echo "--- $name ---" >> "$STATUS"
            if [ -x "$SIGNER" ]; then
              "$SIGNER" verify --print-certs "dist/$name" >> "$STATUS" 2>&1 \
                || echo "apksigner verify FAILED" >> "$STATUS"
            else
              echo "apksigner not found at $SIGNER" >> "$STATUS"
            fi
            unzip -l "dist/$name" | tail -n 4 >> "$STATUS" || true
          }

          publish "mirror/build/outputs/apk/release/mirror-release.apk" "mirror-dash-1.6.apk"
          publish "mirror/build/outputs/apk/debug/mirror-debug.apk" "mirror-dash-debug.apk"

          echo "--- dist ---" >> "$STATUS"
          ls -l dist >> "$STATUS"

      - name: Upload APK artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mirror-apks
          path: |
            mirror/build/outputs/apk/release/*.apk
            mirror/build/outputs/apk/debug/*.apk
          if-no-files-found: warn

      - name: Publish GitHub release
        if: success() && steps.release.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          FILES="dist/mirror-dash-1.6.apk dist/mirror-dash-debug.apk"
          for f in $FILES; do
            if [ ! -f "$f" ]; then
              echo "missing $f, skipping release"
              exit 0
            fi
          done
          TAG="v1.6"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$TAG" $FILES --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" $FILES \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "توپهای همزاد ۱٫۶ — Twin Balls" \
              --notes "نسخه ۱٫۶: ردیف‌های بازتر، تصحیح مسیرهای متحرک و تنظیم منصفانه‌تر سرعت در هر سه درجه. فایل نسخهٔ انتشار را بدون حذف نسخهٔ قبلی نصب کنید."
          fi

      - name: Commit published files
        if: always()
        run: |
          set -eu
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A dist
          if git diff --cached --quiet; then
            echo "Nothing to publish"
          else
            git commit -m "CI: publish mirror APKs [skip ci]"
            git push
          fi
