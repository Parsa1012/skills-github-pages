name: Build Mirror APK

# Manual-only build. Never use the compromised historical signing key.
# Repository secrets are available only to the signing step. No automatic release or git push.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Assemble mirror APKs
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Test real game generator
        run: |
          tools/test_engine.sh
          python3 tools/tests/test_release_policy.py
          python3 tools/simulate_generation.py

      - name: Install Android SDK packages
        run: |
          set -eu
          echo "ANDROID_HOME=${ANDROID_HOME:-unset}"
          if [ -z "${ANDROID_HOME:-}" ]; then
            echo "No pre-installed Android SDK found" >&2
            exit 1
          fi
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ] && [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          fi
          if [ -n "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
            "$SDKMANAGER" --install "platforms;android-36" "build-tools;35.0.0" "platform-tools"
          else
            echo "sdkmanager not found; relying on Gradle's SDK auto-download"
          fi

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          gradle-version: '8.13'

      - name: Inspect dependencies and build demo
        run: |
          set -o pipefail
          gradle :mirror:dependencies --configuration releaseRuntimeClasspath --no-daemon --console=plain | tee /tmp/runtime-deps.txt
          grep -q 'No dependencies' /tmp/runtime-deps.txt
          gradle :mirror:buildEnvironment --no-daemon --console=plain > /tmp/build-deps.txt
          cat /tmp/runtime-deps.txt /tmp/build-deps.txt > /tmp/dependencies.txt
          gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Build debug APK
        run: gradle :mirror:assembleDebug --no-daemon --stacktrace

      - name: Build and verify signed release APK
        env:
          MIRROR_KEYSTORE_BASE64: ${{ secrets.MIRROR_KEYSTORE_BASE64 }}
          MIRROR_STORE_PASSWORD: ${{ secrets.MIRROR_STORE_PASSWORD }}
          MIRROR_KEY_ALIAS: ${{ secrets.MIRROR_KEY_ALIAS }}
          MIRROR_KEY_PASSWORD: ${{ secrets.MIRROR_KEY_PASSWORD }}
          MIRROR_CERT_SHA256: ${{ vars.MIRROR_CERT_SHA256 }}
        run: |
          set -euo pipefail
          : "${MIRROR_KEYSTORE_BASE64:?Missing signing keystore secret}"
          : "${MIRROR_STORE_PASSWORD:?Missing store password secret}"
          : "${MIRROR_KEY_ALIAS:?Missing key alias secret}"
          : "${MIRROR_KEY_PASSWORD:?Missing key password secret}"
          : "${MIRROR_CERT_SHA256:?Missing certificate fingerprint variable}"
          umask 077
          export MIRROR_KEYSTORE_PATH="$RUNNER_TEMP/mirror-release.p12"
          trap 'rm -f "$MIRROR_KEYSTORE_PATH"' EXIT
          printf '%s' "$MIRROR_KEYSTORE_BASE64" | base64 --decode > "$MIRROR_KEYSTORE_PATH"
          unset MIRROR_KEYSTORE_BASE64
          gradle :mirror:assembleRelease --no-daemon --console=plain
          BUILD_TOOLS="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          mkdir -p dist
          python3 tools/verify_release.py "$BUILD_TOOLS/aapt" "$BUILD_TOOLS/apksigner" mirror/build/outputs/apk/release/mirror-release.apk | tee dist/build-status.txt
          cat /tmp/dependencies.txt >> dist/build-status.txt
          cp mirror/build/outputs/apk/release/mirror-release.apk dist/mirror-dash-1.9.apk
          cp mirror/build/outputs/apk/debug/mirror-debug.apk dist/mirror-dash-debug.apk

      - name: Upload APK artifacts
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mirror-apks
          path: |
            dist/mirror-dash-1.9.apk
            dist/mirror-dash-debug.apk
            dist/build-status.txt
          if-no-files-found: error
