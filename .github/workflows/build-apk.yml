name: Build Debug APK

# Builds an installable debug APK for the Demo APK project and uploads it as
# a downloadable artifact. Runs manually and on pushes that touch the app.
on:
  workflow_dispatch:
  push:
    branches:
      - arena/0e2225b6-skills-github-pages
    paths:
      - 'app/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - '.github/workflows/build-apk.yml'

permissions:
  # `contents: write` lets the build publish the APK back onto this branch
  # so it can be fetched without the Actions artifact download flow.
  contents: write

jobs:
  build:
    name: Assemble debug APK
    # Pinned so the pre-installed Android SDK layout stays predictable.
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        run: |
          set -eu
          echo "ANDROID_HOME=${ANDROID_HOME:-unset}"
          if [ -z "${ANDROID_HOME:-}" ]; then
            echo "No pre-installed Android SDK found" >&2
            exit 1
          fi
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ] && [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          fi
          if [ -n "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
            "$SDKMANAGER" --install "platforms;android-34" "build-tools;34.0.0" "platform-tools" || true
          else
            echo "sdkmanager not found; relying on Gradle's SDK auto-download"
          fi
          ls "$ANDROID_HOME/platforms" || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: demo-app-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Publish APK onto the branch
        run: |
          set -eu
          mkdir -p dist
          cp app/build/outputs/apk/debug/*.apk dist/demo-app-debug.apk
          ls -l dist/demo-app-debug.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f dist/demo-app-debug.apk
          if git diff --cached --quiet; then
            echo "APK unchanged, nothing to publish"
          else
            git commit -m "CI: publish demo-app-debug.apk [skip ci]"
            git push
          fi
