name: Build Debug APK

# Builds an installable debug APK for the Demo APK project and uploads it as
# a downloadable artifact. Runs manually.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Assemble debug APK
    # Pinned so the pre-installed Android SDK layout stays predictable.
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        run: |
          set -eu
          echo "ANDROID_HOME=${ANDROID_HOME:-unset}"
          if [ -z "${ANDROID_HOME:-}" ]; then
            echo "No pre-installed Android SDK found" >&2
            exit 1
          fi
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ] && [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          fi
          if [ -n "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
            "$SDKMANAGER" --install "platforms;android-36" "build-tools;35.0.0" "platform-tools"
          else
            echo "sdkmanager not found; relying on Gradle's SDK auto-download"
          fi
          ls "$ANDROID_HOME/platforms" || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          gradle-version: '8.13'

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: demo-app-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
